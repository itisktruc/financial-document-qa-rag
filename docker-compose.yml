services:

  # ==== Backend: FastAPI + RAG pipeline ====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
    env_file:
      - .env
    environment:
      - PYTHONIOENCODING=utf-8      
      - LANG=C.UTF-8
      - LC_ALL=C.UTF-8
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ==== Frontend: Streamlit demo ====
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - BACKEND_URL=http://backend:8000
      - STREAMLIT_SERVER_FILE_WATCHER_TYPE=none
      - STREAMLIT_SERVER_HEADLESS=true
    volumes:
      - ./frontend:/app/frontend
      - ./app:/app/app
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache: